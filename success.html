<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Inquiry Sent | Serendipity Trails
    </title>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            font-family: "DM Sans", sans-serif;

            background:
                linear-gradient(135deg,
                    #12241c,
                    #315f50);

        }

        .success-card {

            max-width: 600px;

            width: 100%;

            padding: 60px 40px;

            border-radius: 20px;

            background: white;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.25);

        }

        .icon {

            width: 85px;
            height: 85px;

            margin:
                0 auto 25px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            background: #e79f31;

            font-size: 35px;

        }

        h1 {

            color: #14231d;

            font-family:
                "Playfair Display",
                serif;

            font-size: 43px;

            margin-bottom: 15px;

        }

        p {

            color: #626965;

            line-height: 1.8;

            margin-bottom: 30px;

        }

        a {

            display: inline-flex;

            gap: 9px;

            align-items: center;

            padding:
                14px 25px;

            border-radius: 7px;

            color: white;

            background: #14231d;

            text-decoration: none;

            font-weight: 600;

            transition: 0.3s;

        }

        a:hover {

            background: #e79f31;

        }
    </style>

</head>


<body>

    <div class="success-card">

        <div class="icon">

            <i class="fa-solid fa-check"></i>

        </div>


        <h1>
            Thank You!
        </h1>


        <p>
            Your travel inquiry has been sent successfully.
            Our team will contact you as soon as possible
            to help plan your Sri Lankan adventure.
        </p>


        <a href="index.html">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Home

        </a>

    </div>

</body>

</html>
